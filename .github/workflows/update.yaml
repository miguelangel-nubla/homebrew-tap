name: update

# Each formula follows the latest release of its project: every day, a formula behind it is made
# of that release, installed and tested on macOS, and only then kept. Nothing but this
# repository is written to, so the workflow's own token is all it needs.
#
# By hand, it does so at once, and installs and tests every formula, as it is when none is behind.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  # Whether a formula is behind, which is all a day without a release asks: not on macOS, whose
  # runners are the ones to wait for.
  behind:
    runs-on: ubuntu-latest
    outputs:
      formulae: ${{ steps.behind.outputs.formulae }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Formulae behind their latest release
        id: behind
        run: |
          ./latest.sh
          formulae=$(git diff --name-only -- Formula | sed 's|Formula/||; s|\.rb$||' | tr '\n' ' ')
          echo "formulae=$formulae" >>"$GITHUB_OUTPUT"
          echo "behind: ${formulae:-none}"

  update:
    needs: behind
    if: needs.behind.outputs.formulae != '' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BEHIND: ${{ needs.behind.outputs.formulae }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Formulae of the latest releases
        run: ./latest.sh
      -
        # Those that were behind; by hand, every one.
        name: Install and test
        run: |
          formulae=$BEHIND
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            formulae=$(ls Formula | sed 's|\.rb$||' | tr '\n' ' ')
          fi
          # The tap is this checkout, with the formulae as they are to be.
          brew tap miguelangel-nubla/tap "$GITHUB_WORKSPACE"
          brew trust miguelangel-nubla/tap 2>/dev/null || true
          for name in $formulae; do
            brew install --build-from-source "miguelangel-nubla/tap/$name"
            brew test "miguelangel-nubla/tap/$name"
            brew audit --strict --formula "miguelangel-nubla/tap/$name"
          done
      -
        name: Keep them
        run: |
          changed=$(git diff --name-only -- Formula | sed 's|Formula/||; s|\.rb$||')
          [ -n "$changed" ] || exit 0
          message=""
          for name in $changed; do
            version=$(sed -n 's|^  url ".*/tags/v\(.*\)\.tar\.gz"$|\1|p' "Formula/$name.rb")
            message="$message${message:+, }$name $version"
          done
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "$message"
          git push -q
